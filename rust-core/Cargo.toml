[package]
name = "swearcore"
version = "0.1.0"
edition = "2021"
description = "Real-time, low-latency speech censor core (delay line + keyword-spotting detector) for the macOS swear-filter app."
license = "MIT"
publish = false

[lib]
name = "swearcore"
# rlib for the Rust unit tests; staticlib/cdylib for the Swift shell to link.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# sherpa: the small streaming keyword-spotter (legacy; weak on music).
sherpa = ["dep:sherpa-rs", "dep:sentencepiece"]
# whisper: transcribe with whisper.cpp (Metal) and match words in the transcript
# — far more robust to music-mixed vocals. This is the path the app builds with.
whisper = ["dep:whisper-rs"]

[dependencies]
# Whisper detector backend (whisper.cpp, statically linked, Metal-accelerated).
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }
# `sys` re-exports the raw `sherpa_rs_sys` FFI, which kws.rs drives directly for
# the continuous streaming keyword-spotting flow (the safe wrapper is one-shot).
sherpa-rs = { version = "0.6", optional = true, features = ["sys"] }
# Tokenises new keywords with the model's own BPE at runtime — identical output
# to scripts/fetch-model.sh — so the app can add words without Python.
sentencepiece = { version = "0.13", optional = true }

[profile.release]
lto = true
codegen-units = 1
